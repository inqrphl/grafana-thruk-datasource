apiVersion: 1

datasources:
  - name: 'thruk-datasource'
    uid: 'sni-thruk-datasource'
    type: 'sni-thruk-datasource'
    url: 'https://demo.thruk.org/demo/thruk'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    basicAuth: true
    basicAuthUser: test
    jsonData:
      authType: basic
      path: '/resources'
      logPath: '/root/sni-thruk-datasource/logs/grafana-thruk-datasource.log'
      logLevel: 3
    secureJsonData:
      apiKey: 'api-key'
      basicAuthPassword: test

  - name: 'thruk-dev-datasource'
    uid: 'thruk-dev-datasource'
    type: 'sni-thruk-datasource'
    url: 'https://192.168.200.201/dev/thruk'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    basicAuth: false
    jsonData:
      path: '/resources'
      logPath: '/root/sni-thruk-datasource/logs/thruk-dev-datasource.log'
      logLevel: 3
      tlsSkipVerify: true


  - name: 'thruk-dev-datasource-alerting'
    uid: 'thruk-dev-datasource-alerting'
    type: 'sni-thruk-datasource'
    url: 'https://192.168.200.201/dev/thruk'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    basicAuth: false
    jsonData:
      path: '/resources'
      logPath: '/root/sni-thruk-datasource/logs/thruk-dev-datasource.log'
      logLevel: 3
      tlsSkipVerify: true
      httpHeaderName1: X-Thruk-Auth-Key
    secureJsonData:
      #httpHeaderValue1: asdasd # superuser api_key
      httpHeaderValue1: asdasd # api key
